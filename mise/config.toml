# mise.toml
#
# 约定：
#   - ${XDG_DATA_HOME}/zsh/site-functions  存放真正的 #compdef 自动加载补全文件（_xxx）
#   - ${XDG_DATA_HOME}/zsh/init.d          存放必须被 source 的 shell 集成脚本（xxx.zsh）
#   - 每个 postinstall 先写 .tmp 再 mv，失败时删除临时文件，避免留下空的补全文件

# ---------------------------------------------------------------------------
# hooks
# ---------------------------------------------------------------------------
[hooks]
preinstall = '''
mkdir -p \
  "${XDG_CONFIG_HOME}" "${XDG_DATA_HOME}" "${XDG_STATE_HOME}" "${XDG_CACHE_HOME}" \
  "${XDG_DATA_HOME}/zsh/site-functions"
mise completion zsh > "${XDG_DATA_HOME}/zsh/site-functions/_mise"
'''

# ---------------------------------------------------------------------------
# env — 让工具把配置/数据/缓存放到 XDG 目录
# ---------------------------------------------------------------------------
[env]
# zsh 补全目录（供 .zshrc 引用）
ZSH_SITE_FUNCTIONS = "${XDG_DATA_HOME}/zsh/site-functions"

# node / npm
NPM_CONFIG_PREFIX = "${XDG_DATA_HOME}/npm"
NPM_CONFIG_CACHE = "${XDG_CACHE_HOME}/npm"
NPM_CONFIG_USERCONFIG = "${XDG_CONFIG_HOME}/npm/npmrc"
NODE_REPL_HISTORY = "${XDG_STATE_HOME}/node/repl_history"
NODE_COMPILE_CACHE = "${XDG_CACHE_HOME}/node"

# bun
BUN_INSTALL = "${XDG_DATA_HOME}/bun"
BUN_INSTALL_CACHE_DIR = "${XDG_CACHE_HOME}/bun/install-cache"
BUN_INSTALL_BIN = "${XDG_DATA_HOME}/bun/bin"

# bat
BAT_CONFIG_PATH = "${XDG_CONFIG_HOME}/bat/config"
BAT_CACHE_PATH = "${XDG_CACHE_HOME}/bat"

# micro
MICRO_CONFIG_HOME = "${XDG_CONFIG_HOME}/micro"
EDITOR = "micro"
VISUAL = "micro"
MICRO_TRUECOLOR = 1

# ripgrep
RIPGREP_CONFIG_PATH = "${XDG_CONFIG_HOME}/ripgrep/ripgreprc"

# eza
EZA_CONFIG_DIR = "${XDG_CONFIG_HOME}/eza"

# fzf
FZF_DEFAULT_OPTS_FILE = "${XDG_CONFIG_HOME}/fzf/fzfrc"
# catppuccin mocha theme for fzf
FZF_DEFAULT_OPTS = """\
--color=bg+:#313244,bg:#1E1E2E,spinner:#F5E0DC,hl:#F38BA8 \
--color=fg:#CDD6F4,header:#F38BA8,info:#CBA6F7,pointer:#F5E0DC \
--color=marker:#B4BEFE,fg+:#CDD6F4,prompt:#CBA6F7,hl+:#F38BA8 \
--color=selected-bg:#45475A \
--color=border:#6C7086,label:#CDD6F4"""

# zoxide
_ZO_DATA_DIR = "${XDG_DATA_HOME}/zoxide"
_ZO_RESOLVE_SYMLINKS = 1
_ZO_EXCLUDE_DIRS = "$HOME:/tmp/*:/proc/*"
_ZO_ECHO = 1

# atuin
ATUIN_CONFIG_DIR = "${XDG_CONFIG_HOME}/atuin"

# tmux
TMUX_PLUGIN_MANAGER_PATH = "${XDG_DATA_HOME}/tmux/plugins"

# starship
STARSHIP_CONFIG = "${XDG_CONFIG_HOME}/starship/starship.toml"
STARSHIP_CACHE = "${XDG_CACHE_HOME}/starship"

# claude code
CLAUDE_CONFIG_DIR = "${XDG_DATA_HOME}/claude"

# ---------------------------------------------------------------------------
# runtimes
# ---------------------------------------------------------------------------

[tools.node]
version = "24.19.0"
postinstall = '''
echo "[INFO] node postinstall"
mkdir -p "${XDG_CONFIG_HOME}/npm" "${XDG_DATA_HOME}/npm" "${XDG_CACHE_HOME}/npm" \
         "${XDG_CACHE_HOME}/node" "${XDG_STATE_HOME}/node"
# npm 的补全产物是「需要 source 的脚本」（内部自己调 compdef），不是 #compdef 文件
# init="${XDG_DATA_HOME}/zsh/init.d/npm.zsh"
# npm completion > "${init}.tmp" && mv "${init}.tmp" "${init}" \
#   || { rm -f "${init}.tmp"; echo '[WARNING] writing npm completions fail.'; }
'''

[tools.bun]
version = "1.4"
postinstall = '''
echo "[INFO] bun postinstall"
mkdir -p "${XDG_DATA_HOME}/bun/bin" "${XDG_CACHE_HOME}/bun/install-cache"
# bun 没有「打印补全到 stdout」的子命令，补全脚本随仓库维护
f="${XDG_DATA_HOME}/zsh/site-functions/_bun"
SHELL=zsh bun completions > "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing bun completions fail.'; }
'''

# ---------------------------------------------------------------------------
# cli tools
# ---------------------------------------------------------------------------

[tools."aqua:atuinsh/atuin"]
version = "18.21.0"
postinstall = '''
echo "[INFO] atuin postinstall"
mkdir -p "${XDG_CONFIG_HOME}/atuin" "${XDG_DATA_HOME}/atuin"
f="${XDG_DATA_HOME}/zsh/site-functions/_atuin"
atuin gen-completions --shell zsh > "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing atuin completions fail.'; }
# 历史搜索的按键绑定来自 init 脚本，预生成可省掉每次启动的子进程
# init="${XDG_DATA_HOME}/zsh/init.d/atuin.zsh"
# atuin init zsh > "${init}.tmp" && mv "${init}.tmp" "${init}" \
#   || { rm -f "${init}.tmp"; echo '[WARNING] writing atuin init fail.'; }
'''

[tools."aqua:sharkdp/bat"]
version = "0.26.1"
postinstall = '''
echo "[INFO] bat postinstall"
mkdir -p "${XDG_CONFIG_HOME}/bat/themes" "${XDG_CONFIG_HOME}/bat/syntaxes" "${XDG_CACHE_HOME}/bat"
f="${XDG_DATA_HOME}/zsh/site-functions/_bat"
bat --completion zsh > "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing bat completions fail.'; }
'''

[tools."aqua:anthropics/claude-code"]
version = "latest"
postinstall = '''
echo "[INFO] claude-code postinstall"
mkdir -p "${XDG_DATA_HOME}/claude"
'''

[tools."aqua:dandavison/delta"]
version = "0.19.2"
postinstall = '''
echo "[INFO] delta postinstall"
# delta 的配置写在 git config 里，没有独立配置目录
f="${XDG_DATA_HOME}/zsh/site-functions/_delta"
delta --generate-completion zsh > "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing delta completions fail.'; }
'''

[tools."aqua:eza-community/eza"]
version = "0.23.5"
postinstall = '''
echo "[INFO] eza postinstall"
mkdir -p "${XDG_CONFIG_HOME}/eza"
f="${XDG_DATA_HOME}/zsh/site-functions/_eza"
curl -fsSL "${GH_PROXY:-}https://raw.githubusercontent.com/eza-community/eza/refs/heads/main/completions/zsh/_eza" \
  -o "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing eza completions fail.'; }
'''

[tools."aqua:sharkdp/fd"]
version = "10.5.0"
postinstall = '''
echo "[INFO] fd postinstall"
# fd 默认读取 ${XDG_CONFIG_HOME}/fd/ignore 作为全局 ignore
mkdir -p "${XDG_CONFIG_HOME}/fd"
f="${XDG_DATA_HOME}/zsh/site-functions/_fd"
fd --gen-completions zsh > "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing fd completions fail.'; }
'''

[tools."aqua:junegunn/fzf"]
version = "0.56.3"
postinstall = '''
echo "[INFO] fzf postinstall"
mkdir -p "${XDG_CONFIG_HOME}/fzf"
[ -f "${XDG_CONFIG_HOME}/fzf/fzfrc" ] || touch "${XDG_CONFIG_HOME}/fzf/fzfrc"
# fzf 没有 #compdef 文件，模糊补全和 CTRL-R/CTRL-T 都在同一份 source 脚本里
# init="${XDG_DATA_HOME}/zsh/init.d/fzf.zsh"
# fzf --zsh > "${init}.tmp" && mv "${init}.tmp" "${init}" \
#   || { rm -f "${init}.tmp"; echo '[WARNING] writing fzf shell integration fail.'; }
'''

[tools."aqua:herdrdev/herdr"]
version = "0.9.0"
postinstall = '''
echo "[INFO] herdr postinstall"
# herdr 直接按 XDG 解析，配置落在 ${XDG_CONFIG_HOME}/herdr
mkdir -p "${XDG_CONFIG_HOME}/herdr"
f="${XDG_DATA_HOME}/zsh/site-functions/_herdr"
herdr completion zsh > "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing herdr completions fail.'; }
'''

[tools."aqua:micro-editor/micro"]
version = "2.0.15"
postinstall = '''
echo "[INFO] micro postinstall"
mkdir -p "${MICRO_CONFIG_HOME:-${XDG_CONFIG_HOME}/micro}"
'''

[tools."aqua:BurntSushi/ripgrep"]
version = "15.2.0"
postinstall = '''
echo "[INFO] ripgrep postinstall"
mkdir -p "${XDG_CONFIG_HOME}/ripgrep"
[ -f "${XDG_CONFIG_HOME}/ripgrep/ripgreprc" ] || touch "${XDG_CONFIG_HOME}/ripgrep/ripgreprc"
f="${XDG_DATA_HOME}/zsh/site-functions/_rg"
rg --generate complete-zsh > "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing rg completions fail.'; }
'''

[tools."aqua:starship/starship"]
version = "1.26.0"
postinstall = '''
echo "[INFO] starship postinstall"
mkdir -p "${XDG_CONFIG_HOME}/starship" "${XDG_CACHE_HOME}/starship"
f="${XDG_DATA_HOME}/zsh/site-functions/_starship"
starship completions zsh > "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing starship completions fail.'; }
# init="${XDG_DATA_HOME}/zsh/init.d/starship.zsh"
# starship init zsh > "${init}.tmp" && mv "${init}.tmp" "${init}" \
#   || { rm -f "${init}.tmp"; echo '[WARNING] writing starship init fail.'; }
'''

[tools."aqua:tmux/tmux-builds"]
version = "3.6a"
postinstall = '''
echo "[INFO] tmux postinstall"
mkdir -p "${XDG_CONFIG_HOME}/tmux" "${XDG_DATA_HOME}/tmux/plugins"
echo "[INFO] installing catppuccin/tmux plugins"
p="${XDG_DATA_HOME}/tmux/plugins/catppuccin/tmux"
[ -d "$p/.git" ] || git clone --depth 1 -b v2.3.0 \
  https://github.com/catppuccin/tmux.git "$p" \
  || echo '[WARNING] cloning catppuccin/tmux fail.'
'''

[tools."aqua:ajeetdsouza/zoxide"]
version = "0.10.0"
postinstall = '''
echo "[INFO] zoxide postinstall"
mkdir -p "${XDG_DATA_HOME}/zoxide"
f="${XDG_DATA_HOME}/zsh/site-functions/_zoxide"
curl -fsSL "${GH_PROXY:-}https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/contrib/completions/_zoxide" \
  -o "${f}.tmp" && mv "${f}.tmp" "${f}" \
  || { rm -f "${f}.tmp"; echo '[WARNING] writing zoxide completions fail.'; }
'''

[tools."aqua:sharkdp/vivid"]
version = "0.11.1"
